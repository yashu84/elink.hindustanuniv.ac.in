<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P0C - Security Assessment</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            background: rgba(0, 5, 0, 0.9);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }

        p {
            font-size: 1.1rem;
            color: #ffffff;
            margin: 15px 0;
        }

        .info {
            color: #888888;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ HACKED BY ... ]</h1>
        <p>This domain is vulnerable to Subdomain Takeover.</p>
        <p style="color: #ff0000; font-weight: bold;">Security Proof of Concept</p>
        
        <div class="info">
            <p>Timestamp: <span id="time"></span></p>
        </div>
    </div>

    <script>
        // Dynamically print the current UTC time for triage reports
        document.getElementById('time').innerText = new Date().toUTCString();
    </script>

</body>
</html>
